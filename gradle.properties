org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# Some networks resolve services.gradle.org to an unreachable IPv6 address and
# then sit there until the socket times out. Preferring IPv4 usually fixes it.
systemProp.java.net.preferIPv4Stack=true

# If you are behind a college or office proxy, fill these in and uncomment.
# systemProp.https.proxyHost=proxy.example.net
# systemProp.https.proxyPort=8080
# systemProp.http.proxyHost=proxy.example.net
# systemProp.http.proxyPort=8080

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
